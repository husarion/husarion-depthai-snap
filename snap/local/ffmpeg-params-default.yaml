---
# HOST-side ffmpeg_image_transport config — scoped ONLY to image_proc::RectifyNode's
# rectified RGB stream (`.../oak/rgb/image_rect`). NOT for the raw stream: the
# on-chip H.264 (.../oak/rgb/image_raw/ffmpeg, husarion_depthai_pipeline) is a
# completely separate, hardware-encoded path that doesn't use image_transport
# or this file at all — see CLAUDE.md "ffmpeg_image_transport for image_rect".
#
# Why this is still needed even with on-chip H.264 covering streaming: the
# on-chip encoder taps the RAW (pre-rectification) ColorCamera.video output —
# there is no hardware equivalent for the RECTIFIED frame. A consumer that
# specifically needs an undistorted + compressed stream has no free path;
# this is it, at host CPU cost (~127% of a core when actually subscribed —
# image_transport publishers are lazy, so zero cost otherwise).
#
# ffmpeg_image_transport derives its ROS parameter prefix from the PUBLISHER'S
# OWN advertised base topic name (before remapping) — image_proc::RectifyNode
# advertises "image_rect", so the prefix is `image_rect.*`, not
# `<name>.rgb.image_rect.*`.
/**:
  ros__parameters:
    image_rect:
      # RectifyNode never had this set, so image_transport defaulted to loading
      # EVERY installed transport plugin — including compressedDepth, which
      # assumes 16-bit depth data and makes no sense for 8-bit RGB. Explicit
      # allowlist instead (2026-08 fix). theora excluded deliberately (not a
      # bug like compressedDepth was) — no OAK-published image supports it.
      enable_pub_plugins: ['image_transport/raw', 'image_transport/compressed', 'image_transport/zstd', 'image_transport/ffmpeg']
      ffmpeg:
        encoder: libx264
        # 2 Mbps target — comfortable for teleop over WiFi 2.4 GHz / weaker
        # links. libx264 requires an explicit bitrate; the default sentinel -1
        # makes `avcodec_open2` fail.
        bit_rate: 2000000
        # IDR keyframe every 30 frames (~1 s @ 30 fps). Do NOT use intra-refresh:
        # the cockpit decodes this stream in the browser via WebCodecs, which
        # cannot start without a real IDR keyframe — an intra-refresh stream
        # emits none, so the video stays black. gop_size gives one IDR per
        # second (a late subscriber waits <=1 s).
        gop_size: 30
        # tune:zerolatency already makes libx264 emit Constrained Baseline (no
        # B-frames) -> the WebCodecs decoder is reliably 1-in-1-out. Do NOT add
        # an explicit `profile:baseline` av-option: the ffmpeg_image_transport
        # plugin fails to open the encoder when it's set. preset:ultrafast
        # keeps host CPU low.
        encoder_av_options: "preset:ultrafast,tune:zerolatency"
