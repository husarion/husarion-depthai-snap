concern: camera
title: Camera
icon: camera
# Parametric, capability-aware camera config. Fields are grouped into Manage
# cards via `group` (Device, Image, Sensors; the probe's flags folded under
# Advanced); dynamic enums read the probe's option files under
# $SNAP_DATA/caps/<field>/; `visible_when` gates depth/ir/imu/pointcloud on the
# probe-detected HAS_* flags (written to camera/local.env). The `camera` hook
# mirrors each field 1:1 onto the matching driver.* snap key — the SAME keys a
# headless `snap set` uses (see CLAUDE.md "driver.resolution/depth/imu/ir/ip").
fields:
  # --- Device: which camera, and how ROS names it --------------------------
  # No default: it depends on the robot's sensor package, and Manage's Stage
  # defaults would reset a working robot to the wrong hardware.
  - { key: CAMERA_MODEL, scope: shared, type: enum, group: Device,
      dynamic: { path: "${SNAP_DATA}/caps/model", glob: "*.opt" },
      label: Camera model, help: "Auto-detected when a camera is connected; pick manually to configure offline." }
  - { key: NAME, scope: shared, type: string, group: Device, pattern: '^[0-9a-z_-]{0,20}$', default: oak,
      label: Node name, help: "ROS node name + topic prefix (/<ns>/<name>/rgb/...)." }
  - { key: IP, scope: local, type: string, group: Device, default: "", pattern: '^([0-9.]{0,15})$',
      label: PoE IP, help: "Set for an OAK-*-PoE (e.g. 10.15.20.6); leave empty for USB." }

  # --- Image (always raw + on-chip H.264 at once — camera-params-autogenerated.yaml) -
  - { key: RGB_RESOLUTION, scope: shared, type: enum, group: Image, default: "720P",
      dynamic: { path: "${SNAP_DATA}/caps/rgb_resolution", glob: "*.opt" },
      label: Resolution }
  - { key: RGB_FPS, scope: shared, type: enum, group: Image, default: "30",
      dynamic: { path: "${SNAP_DATA}/caps/rgb_fps", glob: "*.opt" },
      label: Framerate }
  - { key: RECTIFY_RGB, scope: shared, type: enum, group: Image, options: ["true","false"], default: "true",
      label: Rectify RGB, help: "Lens-corrected RGB stream — required for depth and point cloud below. Disable to save CPU if nothing downstream needs it." }

  # --- Sensors: each shows only when the camera has it (visible_when) -------
  - { key: DEPTH_ENABLE, scope: shared, type: enum, group: Sensors, options: ["true","false"], default: "false",
      visible_when: { HAS_STEREO: "true" }, label: Enable depth,
      help: "Adds metric depth (autonomy) and an on-chip H.264 disparity preview (telepresence)." }
  - { key: POINTCLOUD_ENABLE, scope: shared, type: enum, group: Sensors, options: ["true","false"], default: "false",
      visible_when: { DEPTH_ENABLE: "true" }, label: Publish point cloud }
  - { key: IMU_ENABLE, scope: shared, type: enum, group: Sensors, options: ["true","false"], default: "false",
      visible_when: { HAS_IMU: "true" }, label: Enable IMU }
  - { key: IR_ENABLE, scope: shared, type: enum, group: Sensors, options: ["true","false"], default: "false",
      visible_when: { HAS_IR: "true" }, label: Enable IR illumination }
  - { key: IR_INTENSITY, scope: shared, type: integer, group: Sensors, min: 0, max: 1200, default: 400,
      visible_when: { IR_ENABLE: "true" }, label: Dot projector current (mA),
      help: "Above ~400 mA with depth on, a camera powered only from the computer's USB port resets. Go higher only with a Y-adapter and an external supply." }

  # --- What the probe found. It rewrites these on every probe, so they are
  # set by hand only to configure a camera that is not connected. No default:
  # the Cockpit never calls a detected value "not the default".
  - { key: HAS_STEREO, scope: local, type: enum, group: Advanced · detected hardware, options: ["true","false"],
      label: Stereo (detected), help: "Auto-detected: this camera has a stereo pair (depth available)." }
  - { key: HAS_IR, scope: local, type: enum, group: Advanced · detected hardware, options: ["true","false"],
      label: IR projector (detected), help: "Auto-detected: this camera has an IR dot projector / flood LED." }
  - { key: HAS_IMU, scope: local, type: enum, group: Advanced · detected hardware, options: ["true","false"],
      label: IMU (detected), help: "Auto-detected: this camera has an IMU." }
